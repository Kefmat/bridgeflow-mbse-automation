name: BridgeFlow CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  

    - name: Set up JDK 17
      uses: actions/setup-java@v4 
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4 
      with:
        node-version: '18'

    - name: Compile and Run Quality Gate
      run: |
        javac src/*.java
        java -cp src RequirementTest

    - name: Run Data Transformation
      run: java -cp src ModelExtractor

    - name: Generate Report
      run: node scripts/report_generator.js

    - name: Upload Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: engineering-report
        path: output/